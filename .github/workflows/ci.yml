name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build plugin
        run: rojo build default.project.json --output StudioToolkit.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: StudioToolkit
          path: StudioToolkit.rbxm
